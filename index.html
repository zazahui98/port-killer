<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>端口终结者</title>
    <!--
      这里刻意不放内联主题脚本：
      Tauri 只会给「带 src 的脚本」和 <style> 注入 CSP nonce，
      内联脚本会被严格 CSP 拦截。主题改由 main.tsx 在首帧前应用，
      闪烁问题由 styles.css 里的 prefers-color-scheme 兜底。
    -->
    <style>
      /*
        启动占位界面。

        窗口一创建就是可见的，而 WebView2 初始化 + 加载 JS + React 挂载需要
        几百毫秒。这段时间窗口里没有任何内容，只能显示底色 —— 看上去就是
        「开屏黑屏」。

        这段内联标记在 index.html 解析时就会绘制，比 React 首次绘制早得多，
        于是那段时间用户看到的是应用标识而不是一个空窗口。

        React 挂载时会清空 #root，这段内容随之消失，不需要清理代码。
      */
      html,
      body {
        margin: 0;
        height: 100%;
      }
      .pk-launch {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #0b0c0e;
        color: #e9ebef;
        font: 500 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: -0.01em;
      }
      @media (prefers-color-scheme: light) {
        .pk-launch {
          background: #f6f7f8;
          color: #16181c;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="pk-launch">端口终结者</div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
