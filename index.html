<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>端口终结者</title>
    <!--
      这里刻意不放内联主题脚本：
      Tauri 只会给「带 src 的脚本」和 <style> 注入 CSP nonce，
      内联脚本会被严格 CSP 拦截。主题改由 main.tsx 在首帧前应用，
      闪烁问题由 styles.css 里的 prefers-color-scheme 兜底。
    -->
    <style>
      /*
        启动画面。

        窗口以 visible: false 创建，正常情况下前端画完首帧才显示它，
        这段内容几乎不会被看到。它的作用有两个：

        1. 兜底可见 —— 若前端加载失败，Rust 侧超时后会把窗口显示出来，
           此时用户看到的是这个画面，而不是一个空白窗口。
        2. 万一前端比预期慢，窗口提前显示，看到的也是一个像样的启动画面。

        标记直接写在 index.html 里，解析时即可绘制；样式也内联，
        不必等 styles.css。React 挂载会清空 #root，这段内容自动消失。
      */
      html,
      body {
        margin: 0;
        height: 100%;
      }
      .pk-launch {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #0b0c0e;
        font: 500 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
        letter-spacing: -0.01em;
        animation: pk-launch-in 200ms ease-out both;
      }
      .pk-launch-mark {
        display: grid;
        place-items: center;
        width: 56px;
        height: 56px;
        border-radius: 16px;
        background: rgba(110, 168, 254, 0.12);
      }
      .pk-launch-mark svg {
        fill: #6ea8fe;
      }
      .pk-launch-name {
        color: #9ba1ab;
      }
      @keyframes pk-launch-in {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .pk-launch {
          animation: none;
        }
      }
      @media (prefers-color-scheme: light) {
        .pk-launch {
          background: #f6f7f8;
        }
        .pk-launch-mark {
          background: rgba(37, 99, 235, 0.1);
        }
        .pk-launch-mark svg {
          fill: #2563eb;
        }
        .pk-launch-name {
          color: #5c6169;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="pk-launch">
        <div class="pk-launch-mark">
          <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
            <polygon points="13 2 4 13.5 11 13.5 10.5 22 20 10.5 13 10.5" />
          </svg>
        </div>
        <div class="pk-launch-name">端口终结者</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
